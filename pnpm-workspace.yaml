packages:
  - .

allowBuilds:
  esbuild: true

# pnpm >=11 enforces a 1-day minimumReleaseAge on every lockfile entry, so a
# lockfile pinned to a package published less than 24h ago fails
# `pnpm install --frozen-lockfile` (ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION).
# These versions are unavoidable: package.json ranges float to the newest
# release, so a fresh resolution picks exactly these versions again.
minimumReleaseAgeExclude:
  # dependency-upgrade picks younger than the 24h policy window
  - '@rollup/rollup-android-arm-eabi@4.64.4'
  - '@rollup/rollup-android-arm64@4.64.4'
  - '@rollup/rollup-darwin-arm64@4.64.4'
  - '@rollup/rollup-darwin-x64@4.64.4'
  - '@rollup/rollup-freebsd-arm64@4.64.4'
  - '@rollup/rollup-freebsd-x64@4.64.4'
  - '@rollup/rollup-linux-arm-gnueabihf@4.64.4'
  - '@rollup/rollup-linux-arm-musleabihf@4.64.4'
  - '@rollup/rollup-linux-arm64-gnu@4.64.4'
  - '@rollup/rollup-linux-arm64-musl@4.64.4'
  - '@rollup/rollup-linux-loong64-gnu@4.64.4'
  - '@rollup/rollup-linux-loong64-musl@4.64.4'
  - '@rollup/rollup-linux-ppc64-gnu@4.64.4'
  - '@rollup/rollup-linux-ppc64-musl@4.64.4'
  - '@rollup/rollup-linux-riscv64-gnu@4.64.4'
  - '@rollup/rollup-linux-riscv64-musl@4.64.4'
  - '@rollup/rollup-linux-s390x-gnu@4.64.4'
  - '@rollup/rollup-linux-x64-gnu@4.64.4'
  - '@rollup/rollup-linux-x64-musl@4.64.4'
  - '@rollup/rollup-openbsd-x64@4.64.4'
  - '@rollup/rollup-openharmony-arm64@4.64.4'
  - '@rollup/rollup-win32-arm64-msvc@4.64.4'
  - '@rollup/rollup-win32-ia32-msvc@4.64.4'
  - '@rollup/rollup-win32-x64-gnu@4.64.4'
  - '@rollup/rollup-win32-x64-msvc@4.64.4'
  - 'rollup@4.64.4'
  - '@types/node@26.6.5'

overrides:
  # GHSA-g7r4-m6w7-qqqr (low): esbuild dev server path traversal on Windows,
  # affected >=0.27.3 <0.28.1, fixed in 0.28.1. Reached dev-only via
  # tsup@8.5.1 > esbuild / bundle-require > esbuild, and tsup 8.5.1 (latest 8.x)
  # pins esbuild ^0.27.0, so the newest 0.27.x (0.27.7) is still vulnerable.
  # This lifts esbuild past the ^0.27.0 minor tsup declares (0.x minors are
  # breaking), which is accepted because the fix has no fixed 0.27 release, the
  # only organic alternative is a tsup 9.x major bump (out of scope here), and
  # esbuild 0.28.2 is already in this tree via vite, so the override only aligns
  # tsup's copy with a version the workspace already runs.
  esbuild: ^0.28.1
